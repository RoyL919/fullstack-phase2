<div class="login-container">

  <h1>Chat Login</h1>

  <form (ngSubmit)="login()">

    <label>Username</label>
    <input
      type="text"
      [(ngModel)]="username"
      name="username"
      required>

    <label>Password</label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      required>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <button type="submit">
      Login
    </button>

  </form>

</div>
