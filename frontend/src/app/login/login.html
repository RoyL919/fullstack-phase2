<div class="login-page">

  <div class="login-wrapper">

    <div class="brand">
      <div class="brand-logo">C</div>

      <h1>ChatSpace</h1>

      <p>Connect with your groups and start chatting.</p>
    </div>


    <div class="login-card">

      <h2>Welcome back</h2>

      <p class="subtitle">
        Sign in to your ChatSpace account
      </p>

      <form (ngSubmit)="login()">

        <label>Username</label>

        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          required>


        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required>


        @if (errorMessage) {
          <div class="error">
            {{ errorMessage }}
          </div>
        }


        <button type="submit">
          Sign in
        </button>
        
        <div class="divider">
            <span>or</span>
            </div>

            <a
              routerLink="/register"
              class="register-button">
              Create new account
            </a>
            
      </form>

    </div>

    

    <p class="footer-text">
      ChatSpace
    </p>

  </div>

</div>
