<div class="dashboard-container">

  <header class="dashboard-header">
    <div>
      <h1>Chat Dashboard</h1>

      @if (user) {
        <p>
          Welcome, <strong>{{ user.username }}</strong>
        </p>
      }
    </div>

    <button class="logout-button" (click)="logout()">
      Logout
    </button>
  </header>

  <div class="dashboard-grid">

    <a routerLink="/groups" class="dashboard-card">
      <h2>Groups & Chat</h2>
      <p>View your groups, channels and chat with other users.</p>
    </a>

    <a routerLink="/profile" class="dashboard-card">
      <h2>My Profile</h2>
      <p>View your account and change your profile image.</p>
    </a>

    @if (user?.role === 'admin') {
      <a routerLink="/admin" class="dashboard-card">
        <h2>Admin Panel</h2>
        <p>Manage users and account roles.</p>
      </a>
    }

  </div>

</div>
