<div class="register-page">

  <div class="register-wrapper">

    <div class="brand">

      <div class="brand-logo">
        C
      </div>

      <h1>ChatSpace</h1>

      <p>
        Create your account and start chatting.
      </p>

    </div>


    <div class="register-card">

      <h2>Create account</h2>

      <p class="subtitle">
        Join ChatSpace
      </p>


      <form (ngSubmit)="register()">

        <label>Username</label>

        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Choose a username"
          required>


        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter a password"
          required>


        <label>Confirm password</label>

        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Enter your password again"
          required>


        @if (errorMessage) {
          <div class="error">
            {{ errorMessage }}
          </div>
        }


        @if (successMessage) {
          <div class="success">
            {{ successMessage }}
          </div>
        }


        <button type="submit">
          Create account
        </button>


        <div class="divider">
          <span>or</span>
        </div>


        <a
          routerLink="/login"
          class="login-button">
          Back to sign in
        </a>

      </form>

    </div>

  </div>

</div>
